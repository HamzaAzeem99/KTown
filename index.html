<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Jet-Car - Perfect Camera & Angle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Segoe UI', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.3rem;
            color: #00ffcc;
            letter-spacing: 3px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        
        /* HUD UI */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            z-index: 5;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            pointer-events: none;
        }

        /* Virtual Joystick Container */
        #joystick-container {
            display: none; 
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 255, 204, 0.4);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
            backdrop-filter: blur(5px);
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #00ffcc 0%, #00b399 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
        }

        @media (pointer: coarse) {
            #joystick-container { display: block; }
        }
    </style>
</head>
<body>

    <div id="loader">CALIBRATING VEHICLE MATRIX...</div>
    
    <div id="hud">
        <h3 style="color: #00ffcc; margin-bottom: 5px; letter-spacing: 1px;">FLIGHT INTERFACE</h3>
        <p id="speedometer" style="font-size: 20px; font-weight: bold; color: #fff;">Speed: 0 km/h</p>
        <p style="font-size: 11px; margin-top: 8px; color: #00ffcc; opacity: 0.8;">
            ➔ Mouse Click & Drag: Move Camera/Angle Anywhere<br>
            ➔ WASD / Mobile Joystick: Drive Car
        </p>
    </div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, model, controls;
        const container = document.getElementById('canvas-container');
        
        // Input & Physics Config
        let moveInput = { forward: 0, turn: 0 };
        let isDriving = false; // Is user actively pressing keys?

        let currentSpeed = 0;
        const maxSpeed = 0.4;        
        const acceleration = 0.01;   
        const deceleration = 0.008;  
        const turnSpeed = 0.04;      
        
        let carRotation = 0;
        let carPosition = new THREE.Vector3(0, 0, 0);
        const keysPressed = {};

        // ANGLE ADJUSTMENT OFFSET: Agar car load hote waqt ulti/tedhi dikhe, toh is value ko change karein.
        // Math.PI = 180 degree, Math.PI/2 = 90 degree, 0 = No rotation.
        const MODEL_ANGLE_OFFSET = Math.PI; 

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030308);
            scene.fog = new THREE.FogExp2(0x030308, 0.01);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, -7); // Start camera slightly up and behind

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // Orbit Controls (FIX: Now enabled and works completely with cursor!)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02; // Ground ke neeche camera na jaye
            controls.minDistance = 3;
            controls.maxDistance = 20;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const neonCyan = new THREE.DirectionalLight(0x00ffcc, 1.5);
            neonCyan.position.set(5, 15, 5);
            scene.add(neonCyan);

            const neonPink = new THREE.DirectionalLight(0xff00aa, 1.0);
            neonPink.position.set(-5, 10, -5);
            scene.add(neonPink);

            // Cyber Highway Grid
            const gridHelper = new THREE.GridHelper(2000, 400, 0x00ffcc, 0x111126);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            // Load Model Asset
            const loader = new THREE.GLTFLoader();
            loader.load('car.glb', function (gltf) {
                model = gltf.scene;

                // Center and Scale the Model perfectly
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scaleFactor = 2.2 / maxDim;
                model.scale.set(scaleFactor, scaleFactor, scaleFactor);

                // Fix initial structural rotation inside the scene
                model.rotation.y = MODEL_ANGLE_OFFSET;
                carRotation = MODEL_ANGLE_OFFSET;

                scene.add(model);
                document.getElementById('loader').style.display = 'none';
                
                setupInputListeners();
            }, undefined, function(err) {
                console.error(err);
                document.getElementById('loader').innerText = "Asset Load Error!";
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        // Keyboard Event Handlers
        function setupInputListeners() {
            window.addEventListener('keydown', (e) => {
                keysPressed[e.key.toLowerCase()] = true;
                keysPressed[e.key] = true; 
                updateKeyboardInput();
            });

            window.addEventListener('keyup', (e) => {
                keysPressed[e.key.toLowerCase()] = false;
                keysPressed[e.key] = false;
                updateKeyboardInput();
            });

            function updateKeyboardInput() {
                if (keysPressed['w'] || keysPressed['arrowup']) moveInput.forward = 1;
                else if (keysPressed['s'] || keysPressed['arrowdown']) moveInput.forward = -1;
                else moveInput.forward = 0;

                if (keysPressed['a'] || keysPressed['arrowleft']) moveInput.turn = 1;
                else if (keysPressed['d'] || keysPressed['arrowright']) moveInput.turn = -1;
                else moveInput.turn = 0;

                // Check if user is actively pressing a drive key
                isDriving = (moveInput.forward !== 0 || moveInput.turn !== 0);
            }

            setupMobileJoystick();
        }

        // Joystick Event Handlers
        function setupMobileJoystick() {
            const joystick = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            let isMoving = false;
            let originX = 0, originY = 0;
            const maxDrag = 40;

            joystick.addEventListener('touchstart', (e) => {
                isMoving = true;
                isDriving = true;
                const touch = e.touches[0];
                originX = touch.clientX;
                originY = touch.clientY;
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!isMoving) return;
                const touch = e.touches[0];
                let diffX = touch.clientX - originX;
                let diffY = touch.clientY - originY;
                const distance = Math.sqrt(diffX * diffX + diffY * diffY);
                
                if (distance > maxDrag) {
                    diffX = (diffX / distance) * maxDrag;
                    diffY = (diffY / distance) * maxDrag;
                }

                knob.style.transform = `translate(${diffX}px, ${diffY}px)`;
                moveInput.forward = -(diffY / maxDrag); 
                moveInput.turn = -(diffX / maxDrag);
            }, { passive: false });

            const stopJoystick = () => {
                if (!isMoving) return;
                isMoving = false;
                isDriving = false;
                knob.style.transform = `translate(0px, 0px)`;
                moveInput.forward = 0;
                moveInput.turn = 0;
            };

            window.addEventListener('touchend', stopJoystick);
            window.addEventListener('touchcancel', stopJoystick);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Main Simulation Loop
        function animate() {
            requestAnimationFrame(animate);

            if (model) {
                // 1. Car Physics Engine (Speed)
                if (moveInput.forward !== 0) {
                    currentSpeed += moveInput.forward * acceleration;
                    currentSpeed = Math.max(-maxSpeed/2, Math.min(currentSpeed, maxSpeed));
                } else {
                    if (currentSpeed > 0) currentSpeed = Math.max(0, currentSpeed - deceleration);
                    else if (currentSpeed < 0) currentSpeed = Math.min(0, currentSpeed + deceleration);
                }

                // 2. Car Steering Turning Logic
                if (currentSpeed !== 0) {
                    const directionMultiplier = currentSpeed > 0 ? 1 : -1;
                    carRotation += moveInput.turn * turnSpeed * directionMultiplier * (Math.abs(currentSpeed) / maxSpeed + 0.1);
                    model.rotation.y = carRotation;
                }

                // 3. Apply Coordinates Movement
                carPosition.x += Math.sin(carRotation) * currentSpeed;
                carPosition.z += Math.cos(carRotation) * currentSpeed;
                model.position.copy(carPosition);

                // Speed HUD Update
                const speedKmh = Math.round(Math.abs(currentSpeed) * 350);
                document.getElementById('speedometer').innerText = `Speed: ${speedKmh} km/h`;

                // 4. SMART HYBRID CAMERA CONTROL
                // Camera target setting: OrbitControls point at the car center
                controls.target.copy(new THREE.Vector3(model.position.x, model.position.y + 0.5, model.position.z));

                if (isDriving) {
                    // Jab player move karega, toh camera auto smoothly car ke piche chase mode mein lock ho jayega
                    const cameraDistance = -6.0; 
                    const cameraHeight = 1.8;    
                    
                    const relativeOffset = new THREE.Vector3(0, cameraHeight, cameraDistance);
                    const targetCameraPos = relativeOffset.applyMatrix4(model.matrixWorld);
                    
                    camera.position.lerp(targetCameraPos, 0.05); // Smooth lag interpolation
                } else {
                    // Jab player ruka hua hai aur mouse drag kar raha hai, Orbit controls free chalenge!
                    controls.update();
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = () => {
            init();
            animate();
        };
    </script>
</body>
</html>
