<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>3D Jet Car - Smooth Movement</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

body{
    overflow:hidden;
    background:#05050a;
    font-family:Segoe UI,sans-serif;
}

#canvas-container{
    width:100vw;
    height:100vh;
}

#loader{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#00ffcc;
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
    z-index:10;
}

#hud{
    position:absolute;
    top:20px;
    left:20px;
    z-index:5;
    color:white;
    background:rgba(0,0,0,.65);
    border:1px solid rgba(0,255,204,.3);
    border-radius:12px;
    padding:15px 20px;
    backdrop-filter:blur(10px);
}

#speedometer{
    font-size:22px;
    color:#00ffcc;
    margin-top:10px;
    font-weight:bold;
}

#joystick-container{
    display:none;
    position:absolute;
    bottom:40px;
    left:40px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(0,255,204,.4);
    z-index:20;
    touch-action:none;
}

#joystick-knob{
    position:absolute;
    width:50px;
    height:50px;
    border-radius:50%;
    left:35px;
    top:35px;
    background:radial-gradient(circle,#00ffcc,#009977);
    box-shadow:0 0 20px rgba(0,255,204,.7);
}

@media (pointer: coarse){
    #joystick-container{
        display:block;
    }
}
</style>
</head>

<body>

<div id="loader">LOADING CAR...</div>

<div id="hud">
    <h2 style="color:#00ffcc;">JET CAR</h2>

    <div id="speedometer">
        Speed: 0 km/h
    </div>

    <div style="margin-top:10px;font-size:12px;line-height:20px;color:#ccc;">
        W / ↑ = Forward<br>
        S / ↓ = Reverse<br>
        A D = Steering<br>
        Mouse Drag = Camera
    </div>
</div>

<div id="joystick-container">
    <div id="joystick-knob"></div>
</div>

<div id="canvas-container"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

let scene;
let camera;
let renderer;
let controls;
let model;

const container = document.getElementById("canvas-container");

const keys = {};

let moveInput = {
    forward:0,
    turn:0
};

let currentSpeed = 0;

const maxSpeed = 0.6;
const acceleration = 0.015;
const turnSpeed = 0.03;

let carRotation = Math.PI;
let carPosition = new THREE.Vector3(0,0,0);


// ======================================
// INIT
// ======================================

function init(){

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030308);

    scene.fog = new THREE.FogExp2(0x030308,0.015);

    camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth/window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(0,3,-8);

    renderer = new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.outputEncoding = THREE.sRGBEncoding;

    container.appendChild(renderer.domElement);

    // ======================================
    // CONTROLS
    // ======================================

    controls = new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

    controls.enableDamping = true;
    controls.enablePan = false;

    controls.maxPolarAngle = Math.PI/2.1;

    controls.minDistance = 4;
    controls.maxDistance = 18;

    // ======================================
    // LIGHTS
    // ======================================

    const ambient = new THREE.AmbientLight(
        0xffffff,
        0.7
    );

    scene.add(ambient);

    const cyanLight = new THREE.DirectionalLight(
        0x00ffcc,
        1.5
    );

    cyanLight.position.set(5,10,5);

    scene.add(cyanLight);

    const pinkLight = new THREE.DirectionalLight(
        0xff00aa,
        1
    );

    pinkLight.position.set(-5,10,-5);

    scene.add(pinkLight);

    // ======================================
    // FLOOR GRID
    // ======================================

    const grid = new THREE.GridHelper(
        500,
        100,
        0x00ffcc,
        0x111122
    );

    scene.add(grid);

    // ======================================
    // LOAD CAR
    // ======================================

    const loader = new THREE.GLTFLoader();

    loader.load(

        "car.glb",

        function(gltf){

            model = gltf.scene;

            const box = new THREE.Box3()
                .setFromObject(model);

            const size = box.getSize(
                new THREE.Vector3()
            );

            const maxDim = Math.max(
                size.x,
                size.y,
                size.z
            );

            const scale = 2.2 / maxDim;

            model.scale.set(scale,scale,scale);

            model.rotation.y = carRotation;

            scene.add(model);

            document.getElementById("loader")
                .style.display = "none";

        },

        undefined,

        function(error){

            console.log(error);

            document.getElementById("loader")
                .innerHTML = "CAR LOAD ERROR";
        }

    );

    setupControls();

    window.addEventListener(
        "resize",
        onWindowResize
    );
}


// ======================================
// KEYBOARD
// ======================================

function setupControls(){

    window.addEventListener("keydown",(e)=>{

        keys[e.key.toLowerCase()] = true;

        updateMovement();

    });

    window.addEventListener("keyup",(e)=>{

        keys[e.key.toLowerCase()] = false;

        updateMovement();

    });

    function updateMovement(){

        moveInput.forward = 0;
        moveInput.turn = 0;

        if(keys["w"] || keys["arrowup"]){

            moveInput.forward = 1;
        }

        if(keys["s"] || keys["arrowdown"]){

            moveInput.forward = -1;
        }

        if(keys["a"] || keys["arrowleft"]){

            moveInput.turn = 1;
        }

        if(keys["d"] || keys["arrowright"]){

            moveInput.turn = -1;
        }
    }

    setupJoystick();
}


// ======================================
// MOBILE JOYSTICK
// ======================================

function setupJoystick(){

    const joystick =
        document.getElementById(
            "joystick-container"
        );

    const knob =
        document.getElementById(
            "joystick-knob"
        );

    let dragging = false;

    let startX = 0;
    let startY = 0;

    const maxDistance = 40;

    joystick.addEventListener(
        "touchstart",
        (e)=>{

            dragging = true;

            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }
    );

    window.addEventListener(
        "touchmove",
        (e)=>{

            if(!dragging) return;

            const touch = e.touches[0];

            let dx = touch.clientX - startX;
            let dy = touch.clientY - startY;

            const dist =
                Math.sqrt(dx*dx + dy*dy);

            if(dist > maxDistance){

                dx = dx / dist * maxDistance;
                dy = dy / dist * maxDistance;
            }

            knob.style.transform =
                `translate(${dx}px,${dy}px)`;

            moveInput.forward = -dy/maxDistance;
            moveInput.turn = -dx/maxDistance;

        },
        {passive:false}
    );

    function stopJoystick(){

        dragging = false;

        knob.style.transform =
            `translate(0px,0px)`;

        moveInput.forward = 0;
        moveInput.turn = 0;
    }

    window.addEventListener(
        "touchend",
        stopJoystick
    );

    window.addEventListener(
        "touchcancel",
        stopJoystick
    );
}


// ======================================
// RESIZE
// ======================================

function onWindowResize(){

    camera.aspect =
        window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


// ======================================
// ANIMATION
// ======================================

function animate(){

    requestAnimationFrame(animate);

    if(model){

        // =============================
        // ACCELERATION
        // =============================

        if(moveInput.forward !== 0){

            currentSpeed +=
                moveInput.forward *
                acceleration;

        }else{

            currentSpeed *= 0.96;
        }

        currentSpeed =
            THREE.MathUtils.clamp(
                currentSpeed,
                -maxSpeed * 0.5,
                maxSpeed
            );

        // =============================
        // TURNING
        // =============================

        if(Math.abs(currentSpeed) > 0.002){

            const steering =
                turnSpeed *
                (Math.abs(currentSpeed)/maxSpeed);

            carRotation +=
                moveInput.turn * steering;

            model.rotation.y = carRotation;
        }

        // =============================
        // MOVEMENT
        // =============================

        const forwardX =
            Math.sin(carRotation);

        const forwardZ =
            Math.cos(carRotation);

        carPosition.x +=
            forwardX * currentSpeed;

        carPosition.z +=
            forwardZ * currentSpeed;

        model.position.copy(carPosition);

        // =============================
        // SPEEDOMETER
        // =============================

        const speed =
            Math.round(
                Math.abs(currentSpeed) * 400
            );

        document.getElementById(
            "speedometer"
        ).innerHTML =
            `Speed: ${speed} km/h`;

        // =============================
        // CAMERA FOLLOW
        // =============================

        const offset = new THREE.Vector3(
            0,
            2.5,
            -7
        );

        offset.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            carRotation
        );

        const targetCamera =
            new THREE.Vector3(
                carPosition.x + offset.x,
                carPosition.y + offset.y,
                carPosition.z + offset.z
            );

        camera.position.lerp(
            targetCamera,
            0.08
        );

        controls.target.lerp(
            new THREE.Vector3(
                carPosition.x,
                carPosition.y + 1,
                carPosition.z
            ),
            0.1
        );

        controls.update();
    }

    renderer.render(scene,camera);
}


// ======================================
// START
// ======================================

window.onload = ()=>{

    init();

    animate();
};

</script>

</body>
</html>
